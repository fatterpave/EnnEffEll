<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Live Scores</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --tile: #151c2e;
      --tile-border: #273149;
      --text: #f4f6fb;
      --muted: #929db2;
      --accent: #72e0a0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    header .refresh {
      justify-self: end;
    }

    h1 {
      font-size: clamp(24px, 4vw, 34px);
      margin: 0;
      letter-spacing: -0.7px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 7px;
    }

    .refresh {
      font-size: 12px;
      color: var(--muted);
    }

    .minimize-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .minimize-toggle input {
      accent-color: var(--accent);
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .game {
      background: var(--tile);
      border: 1px solid var(--tile-border);
      border-radius: 15px;
      padding: 16px;
      min-width: 0;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 0px;
    }

    .game-date {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    /* Kvarter og gjenværende tid for pågående kamper */
    .game-clock {
      font-size: 11px;
      font-weight: 700;
      color: #ff7373;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .game-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    /* Stjerne – festede kamper legges øverst */
    .pin-btn {
      background: none;
      border: 0;
      padding: 6px;
      margin: -6px -6px -6px 0;
      font-size: 16px;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .pin-btn.pinned {
      color: #ffd166;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-align: right;
    }

    .status.live {
      color: #ff7373;
    }

    .status.final {
      color: var(--accent);
    }

    .team-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .team-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .team-text {
      min-width: 0;
    }

    .team-name {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    /* Diskret WIN-LOSSES under lagnavnet */
    .team-record {
      color: #929db2;
      font-size: 11px;
      margin-top: 3px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .team-score {
      font-size: 25px;
      font-weight: 800;
      min-width: 25px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .game-footer {
      border-top: 1px solid var(--tile-border);
      margin-top: 10px;
      padding-top: 11px;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .message {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      background: var(--tile);
      border-radius: 15px;
      line-height: 1.6;
    }

    .error {
      color: #ff9292;
    }

    @media (max-width: 400px) {
      body {
        padding: 18px 10px 30px;
      }

      .games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .game {
        padding: 13px;
      }
    }

    /* Green border for live games */
    .game.live-game {
      border: 1px solid #35d07f;
      box-shadow: 0 0 8px rgba(53, 208, 127, 0.12);
    }

    .game.final-game {
      color: gray;
    }

    /* Smooth blinking when the score changes */
    .game.score-changed {
      animation: scorePulse 1.2s ease-in-out infinite;
    }

    @keyframes scorePulse {
      0%, 100% {
        border-color: #35d07f;
        background-color: var(--tile);
      }

      50% {
        border-color: #b5ffd0;
        background-color: #1c2b2b;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .game.score-changed {
        animation: none;
        border-color: #35d07f;
      }
    }

    /* Kort/lang visning – begge ligger i markupen, CSS velger */
    .name-short,
    .date-short {
      display: none;
    }

    /* Minimize: 3 kolonner, forkortelser, små logoer, ingen W–L */
    body.minimized {
      padding: 12px 8px 16px;
    }

    body.minimized header {
      margin-bottom: 10px;
    }

    body.minimized h1 {
      font-size: 20px;
    }

    body.minimized .name-full,
    body.minimized .date-full,
    body.minimized .team-record {
      display: none;
    }

    body.minimized .name-short,
    body.minimized .date-short {
      display: inline;
    }

    body.minimized .games {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    body.minimized .game {
      padding: 6px 8px;
      border-radius: 10px;
    }

    /* Live-kamper viser klokken i stedet for dato */
    body.minimized .game.live-game .game-date {
      display: none;
    }

    body.minimized .team-row {
      padding: 2px 0;
      gap: 4px;
    }

    body.minimized .team-info {
      gap: 5px;
    }

    body.minimized .team-logo {
      width: 20px;
      height: 20px;
    }

    body.minimized .team-name {
      font-size: 12px;
    }

    body.minimized .team-score {
      font-size: 16px;
      min-width: 0;
    }

    body.minimized .game-date {
      font-size: 10px;
    }

    body.minimized .pin-btn {
      font-size: 14px;
    }

    .team-score.has-possession {
      color: #ffd166;
    }

    .team-score.is-home {
      color: #4b976b;
    }

    .team-score.is-final {
      color: gray;
    }
  </style>
</head>

<body>
<main class="container">
  <header>
    <div>
      <h1>🏈 NFL Scores</h1>
    </div>

    <label class="minimize-toggle">
      <input type="checkbox" id="minimize">
      Minimize
    </label>

    <div class="refresh" id="lastUpdated">
      Henter resultater …
    </div>
  </header>

  <section id="games" class="games">
    <div class="message">Laster NFL-kamper …</div>
  </section>
</main>

<script>
  const API_URL =
          "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";

  const REFRESH_INTERVAL = 15000;

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  // Viser dato og klokkeslett i norsk tid.
  function norskDato(isoDato) {
    if (!isoDato) return "Tidspunkt ikke tilgjengelig";

    const dato = new Date(isoDato);

    if (Number.isNaN(dato.getTime())) {
      return "Tidspunkt ikke tilgjengelig";
    }

    const datoDel = new Intl.DateTimeFormat("nb-NO", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      timeZone: "Europe/Oslo"
    }).format(dato);

    const tidDel = new Intl.DateTimeFormat("nb-NO", {
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23",
      timeZone: "Europe/Oslo"
    }).format(dato);

    return `${datoDel} kl. ${tidDel}`;
  }

  // Kort variant for minimert visning, f.eks. "søn. kl. 14:30".
  function norskDatoKort(isoDato) {
    const dato = new Date(isoDato);

    if (!isoDato || Number.isNaN(dato.getTime())) return "";

    return new Intl.DateTimeFormat("nb-NO", {
      weekday: "short",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23",
      timeZone: "Europe/Oslo"
    }).format(dato);
  }

  // Hent lagets W-L-statistikk fra ESPN.
  function hentRecord(competitor) {
    const team = competitor.team || {};

    // ESPN kan legge statistikken på laget eller på competitor.
    const records = [
      ...(competitor.records || []),
      ...(team.records || [])
    ];

    // Se etter totalstatistikk for sesongen.
    const overall = records.find(record =>
            /total|overall|overall record/i.test(
                    `${record.type || ""} ${record.name || ""} ${record.abbreviation || ""}`
            )
    );

    const record = overall || records[0];

    if (record?.summary) {
      return record.summary.replace(/-/g, "–");
    }

    if (record?.wins != null && record?.losses != null) {
      return `${record.wins}–${record.losses}`;
    }

    return "";
  }

  function lagRad(competitor, event) {
    const team = competitor.team || {};
    const navn = team.displayName || team.name || "Ukjent lag";
    const kort = team.abbreviation || navn;
    const logo = team.logo || "";
    const score = competitor.score ?? "–";
    const isHome = competitor.homeAway === "home";
    const record = hentRecord(competitor);

    return `
        <div class="team-row">
          <div class="team-info">
            ${
            logo
                    ? `<img
                     class="team-logo"
                     src="${escapeHtml(logo)}"
                     alt=""
                     loading="lazy"
                   >`
                    : ""
    }

            <div class="team-text">
              <div class="team-name">
                <span class="name-full">${escapeHtml(navn)}</span>
                <span class="name-short">${escapeHtml(kort)}</span>
              </div>
              ${
            record
                    ? `<div class="team-record">${escapeHtml(record)}</div>`
                    : `<div class="team-record">W–L ikke tilgjengelig</div>`
    }
            </div>
          </div>

          <div class="team-score ${isHome ? 'is-home' : ''} ${event.status?.type?.completed ? 'is-final' : ''} ${competitor.hasPossession ? 'has-possession' : ''}">
            ${escapeHtml(score)}
          </div>
        </div>
      `;
  }

  function kampStatus(event) {
    const status = event.status?.type || {};
    const state = status.state;
    const description = status.shortDetail || status.detail || "";

    if (state === "in") {
      return {
        text: description || "LIVE",
        className: "live"
      };
    }

    if (state === "post") {
      console.log(event);
      return {
        text: status.completed ? "FERDIG" : (description || "FERDIG"),
        className: "final"
      };
    }

    return {
      text: description || "KOMMENDE",
      className: ""
    };
  }

  // Kvarter og gjenværende tid – kun for pågående kamper.
  function kampKlokke(event) {
    const status = event.status || {};
    const type = status.type || {};

    if (type.state !== "in") return "";
    if (type.name === "STATUS_HALFTIME") return "Pause";

    const p = status.period ?? 0;
    const kvarter = p > 4 ? (p === 5 ? "OT" : `${p - 4}. OT`) : `Q${p}`;

    if (type.name === "STATUS_END_PERIOD") return `Slutt ${kvarter}`;

    return `${kvarter} · ${status.displayClock ?? ""}`;
  }

  const previousScores = new Map();
  const blinkingGames = new Map();

  // Festede kamper (event-id) – huskes i nettleseren.
  const PIN_KEY = "nfl-pinned";
  const pinned = new Set(JSON.parse(localStorage.getItem(PIN_KEY) || "[]"));
  let sisteKamper = [];

  function scoreChanged(eventId, score) {
    const previous = previousScores.get(eventId);
    previousScores.set(eventId, score);

    if (previous === undefined || previous === score) {
      return false;
    }

    blinkingGames.set(eventId, Date.now() + 10000);
    return true;
  }

  function isBlinking(eventId) {
    const until = blinkingGames.get(eventId);

    if (!until) return false;

    if (Date.now() >= until) {
      blinkingGames.delete(eventId);
      return false;
    }

    return true;
  }

  const possessionByGame = new Map();

  async function hentBesittelse(event) {
    const competition = event.competitions?.[0];

    if (event.status?.type?.state !== "in" || !competition) {
      possessionByGame.delete(event.id);
      return;
    }

    try {
      const response = await fetch(
        `https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/${event.id}/competitions/${competition.id}/situation`,
        { cache: "no-store" }
      );

      if (!response.ok) return;

      const situation = await response.json();
      const possession = situation.possession;

      const possessionId =
      typeof possession === "object"
        ? possession.id ?? possession.$ref?.split("/").pop()
        : possession;

      possessionByGame.set(event.id, possessionId ?? null);
    } catch (error) {
      console.warn("Could not fetch possession:", event.id, error);
    }
  }

  function lagKort(event) {
    const competition = event.competitions?.[0];
    const competitors = competition?.competitors || [];

    const home = competitors.find(team => team.homeAway === "home");
    const away = competitors.find(team => team.homeAway === "away");

    if (!home || !away) return "";

    const status = kampStatus(event);
    const klokke = kampKlokke(event);
    const eventId = event.id;
    const festet = pinned.has(eventId);
    const scoreKey = [
      away.score ?? "0",
      home.score ?? "0"
    ].join("-");

    scoreChanged(eventId, scoreKey);

    const liveClass = status.className === "live" ? "live-game" : status.className === "final" ? "final-game" : "";
    const blinkClass = isBlinking(eventId) ? "score-changed" : "";
    const venue = competition.venue?.fullName || "";

    return `
        <article class="game ${liveClass} ${blinkClass}">
          <div class="game-header">
            <div class="game-date">
              <span class="date-full">${escapeHtml(norskDato(event.date))}</span>
              <span class="date-short">${escapeHtml(norskDatoKort(event.date))}</span>
            </div>

            <div class="game-meta">
              ${klokke ? `<div class="game-clock">${escapeHtml(klokke)}</div>` : ""}
              <button
                type="button"
                class="pin-btn ${festet ? "pinned" : ""}"
                data-id="${escapeHtml(eventId)}"
                aria-pressed="${festet}"
                aria-label="Fest kampen øverst"
              >${festet ? "★" : "☆"}</button>
            </div>
          </div>

          ${lagRad(away, event)}
          ${lagRad(home, event)}

          <!--<div class="game-footer">
            <span>${escapeHtml(venue || "NFL")}</span>
            <span>${escapeHtml(event.name || "")}</span>
          </div>-->
        </article>
      `;
  }

  // Tegner kampene på nytt fra siste henting – festede først, ellers ESPN-rekkefølge.
  function visKamper() {
    const gamesElement = document.getElementById("games");

    if (sisteKamper.length === 0) {
      gamesElement.innerHTML = `
          <div class="message">
            Ingen kamper funnet akkurat nå.
            Prøv igjen litt senere.
          </div>
        `;
      return;
    }

    gamesElement.innerHTML = [...sisteKamper]
            .sort((a, b) => pinned.has(b.id) - pinned.has(a.id))
            .map(lagKort)
            .filter(Boolean)
            .join("");
  }

  async function hentKamper() {
    const gamesElement = document.getElementById("games");
    const updatedElement = document.getElementById("lastUpdated");

    try {
      const response = await fetch(API_URL, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`HTTP-feil ${response.status}`);
      }

      const data = await response.json();
        sisteKamper = data.events || [];

        await Promise.all(
          sisteKamper
            .filter(event => event.status?.type?.state === "in")
            .map(hentBesittelse)
        );

        sisteKamper.forEach(event => {
          const competitors = event.competitions?.[0]?.competitors || [];
          const possessionId = possessionByGame.get(event.id);

          competitors.forEach(team => {
            team.hasPossession =
              possessionId != null &&
              String(team.id) === String(possessionId);
          });
        });

        visKamper();

        updatedElement.textContent =
                "Oppdatert " +
                new Intl.DateTimeFormat("nb-NO", {
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit",
                  timeZone: "Europe/Oslo"
                }).format(new Date());

    } catch (error) {
      console.error("Kunne ikke hente NFL-resultater:", error);

      gamesElement.innerHTML = `
          <div class="message error">
            Kunne ikke hente NFL-resultatene.<br>
            Kontroller internettforbindelsen, eller prøv igjen senere.
            <br><br>
            Hvis dette skjer hver gang, kan ESPN API-et ha begrenset
            direkte forespørsler fra nettleseren (CORS).
          </div>
        `;

      updatedElement.textContent = "Oppdatering mislyktes";
    }
  }

  // Minimize – valget huskes i nettleseren.
  const minimize = document.getElementById("minimize");
  minimize.checked = localStorage.getItem("nfl-minimize") === "1";
  document.body.classList.toggle("minimized", minimize.checked);

  minimize.addEventListener("change", () => {
    document.body.classList.toggle("minimized", minimize.checked);
    localStorage.setItem("nfl-minimize", minimize.checked ? "1" : "0");
  });

  // Stjerne – én lytter på hele rutenettet, overlever re-render.
  document.getElementById("games").addEventListener("click", e => {
    const knapp = e.target.closest(".pin-btn");

    if (!knapp) return;

    const id = knapp.dataset.id;
    pinned.has(id) ? pinned.delete(id) : pinned.add(id);
    localStorage.setItem(PIN_KEY, JSON.stringify([...pinned]));
    visKamper();
  });

  hentKamper();
  setInterval(hentKamper, REFRESH_INTERVAL);
</script>
</body>
</html>
